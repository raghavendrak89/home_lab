apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: ai
  labels:
    app: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: whisper
          image: fedirz/faster-whisper-server:latest-cpu
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: WHISPER__MODEL
              value: "Systran/faster-whisper-small"
            - name: WHISPER__INFERENCE_DEVICE
              value: "cpu"
            - name: UVICORN_HOST
              value: "0.0.0.0"
            - name: UVICORN_PORT
              value: "8000"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
  namespace: ai
  labels:
    app: whisper
spec:
  selector:
    app: whisper
  ports:
    - port: 8000
      targetPort: 8000
      name: http
