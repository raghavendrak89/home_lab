apiVersion: apps/v1
kind: Deployment
metadata:
  name: piper
  namespace: ai
  labels:
    app: piper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piper
  template:
    metadata:
      labels:
        app: piper
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: piper
          image: docker.io/raghavendrak/piper-tts:latest
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: piper
  namespace: ai
  labels:
    app: piper
spec:
  selector:
    app: piper
  ports:
    - port: 8000
      targetPort: 8000
      name: http
