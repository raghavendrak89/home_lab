    {\n      const subject = document.getElementById(\"hw-subject\").value.trim();\n
    \     const description = document.getElementById(\"hw-desc\").value.trim();\n
    \     const due_date = document.getElementById(\"hw-due\").value || null;\n      if
    (!subject || !description) return;\n      await api(\"/tutor/homework\", {\n        method:
