    I played a sport!</button>\n        </div>\n        <button class=\"big-btn\"
    onclick=\"logWellness('hydration', {count: 1})\">\U0001F4A7 I drank some water!</button>\n
    \       <button class=\"big-btn\" onclick=\"logWellness('sleep_consistency', {})\">\U0001F634
