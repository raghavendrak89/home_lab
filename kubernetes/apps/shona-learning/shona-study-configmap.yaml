    = \"\";\n      loadHomework();\n    }\n\n    async function completeHomework(id)
    {\n      await api(`/tutor/homework/${id}/complete`, { method: \"POST\" });\n
    \     loadHomework();\n    }\n\n    async function loadReadingStreak() {\n      const
    s = await api(\"/tutor/reading-streak\");\n      document.getElementById(\"streak-badge\").textContent
    = \"\U0001F525 \" + s.reading_streak_days;\n    }\n\n    async function logReading()
    {\n      const detail = document.getElementById(\"read-book\").value.trim() ||
