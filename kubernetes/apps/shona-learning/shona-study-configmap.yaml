    {\n      const login = document.getElementById(\"login-input\").value.trim();\n
    \     const passphrase = document.getElementById(\"pass-input\").value;\n      document.getElementById(\"login-error\").textContent
    = \"\";\n      try {\n        await api(\"/auth/login\", {\n          method:
    \"POST\",\n          headers: { \"Content-Type\": \"application/json\" },\n          body:
    JSON.stringify({ login, passphrase }),\n        });\n        const me = await
    api(\"/auth/me\");\n        myUserId = me.user_id;\n        document.getElementById(\"login-view\").classList.add(\"hidden\");\n
    \       document.getElementById(\"tabbar\").style.display = \"flex\";\n        showView(\"chat\");\n
    \       loadReadingStreak();\n      } catch (e) {\n        document.getElementById(\"login-error\").textContent
    = \"Hmm, that didn't work. Try again? \U0001F914\";\n      }\n    }\n\n    function
    showView(name) {\n      for (const v of [\"chat\", \"snap\", \"homework\", \"reading\",
    \"timetable\", \"storybook\", \"wellness\"]) {\n        document.getElementById(v
    + \"-view\").classList.toggle(\"hidden\", v !== name);\n      }\n      for (const
    btn of document.querySelectorAll(\".tab-btn\")) {\n        btn.classList.toggle(\"active\",
    btn.dataset.view === name);\n      }\n      if (name === \"homework\") loadHomework();\n
    \     if (name === \"reading\") loadReadingStreak();\n      if (name === \"timetable\")
    loadTimetable();\n      if (name === \"storybook\") loadStories();\n      if (name
    === \"wellness\") loadWellness();\n    }\n    document.querySelectorAll(\".tab-btn\").forEach(btn
    =>\n      btn.addEventListener(\"click\", () => showView(btn.dataset.view))\n
    \   );\n\n    function addChatBubble(text, who) {\n      const log = document.getElementById(\"chat-log\");\n
    \     const div = document.createElement(\"div\");\n      div.className = \"msg
    \" + who;\n      div.textContent = text;\n      log.appendChild(div);\n      log.scrollTop
    = log.scrollHeight;\n    }\n\n    async function sendChat() {\n      const input
    = document.getElementById(\"chat-input\");\n      const text = input.value.trim();\n
    \     if (!text) return;\n      input.value = \"\";\n      addChatBubble(text,
    \"me\");\n      try {\n        const reply = await api(\"/chat\", {\n          method:
    \"POST\",\n          headers: { \"Content-Type\": \"application/json\" },\n          body:
    JSON.stringify({ text, conversation_id: conversationId }),\n        });\n        conversationId
    = reply.conversation_id;\n        addChatBubble(reply.text, \"bot\");\n      }
    catch (e) {\n        addChatBubble(\"Oops, I couldn't hear that. Try again? \U0001F615\",
    \"bot\");\n      }\n    }\n\n    async function toggleRecording() {\n      const
    btn = document.getElementById(\"mic-btn\");\n      if (mediaRecorder && mediaRecorder.state
