    \   <button class=\"tab-btn\" data-view=\"wellness\"><span class=\"emoji\">\U0001F308</span>Wellness</button>\n
    \   <button class=\"tab-btn\" data-view=\"timetable\"><span class=\"emoji\">\U0001F5D3️</span>Timetable</button>\n
    \ </div>\n\n  <script>\n    const DAY_NAMES = [\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\",\"Sunday\"];\n
    \   let conversationId = null;\n    let mediaRecorder = null;\n    let audioChunks
