    \     }\n      btn.disabled = false;\n    }\n\n    function numVal(id) {\n      const
    v = parseFloat(document.getElementById(id).value);\n      return isNaN(v) ? undefined
    : v;\n    }\n    function strVal(id) {\n      const v = document.getElementById(id).value.trim();\n
    \     return v || undefined;\n    }\n\n    async function logWellness(kind, extra)
    {\n      try {\n        await api(\"/wellness/logs\", {\n          method: \"POST\",\n
    \         headers: { \"Content-Type\": \"application/json\" },\n          body:
    JSON.stringify({ kind, ...extra }),\n        });\n        [\"wellness-minutes\",
    \"wellness-sport\", \"wellness-sport-minutes\", \"wellness-colors\"].forEach(id
    => {\n          const el = document.getElementById(id);\n          if (el) el.value
    = \"\";\n        });\n        loadWellness();\n      } catch (e) {\n        alert(\"Oops,
    that didn't save. Try again?\");\n      }\n    }\n\n    async function loadWellness()
    {\n      const since = new Date(Date.now() - 7 * 86400000).toISOString().slice(0,
    10);\n      const [s, goals, challenges] = await Promise.all([\n        api(`/wellness/summary?since=${since}`),\n
    \       api(\"/wellness/goals\"),\n        api(\"/wellness/challenges\"),\n      ]);\n
    \     document.getElementById(\"wellness-stats\").innerHTML =\n        `\U0001F3C3
    ${s.active_minutes_total} active min · \U0001F308 ${s.rainbow_plate_days} rainbow
    days · ` +\n        `\U0001F4A7 ${s.hydration_days_logged} hydration days · \U0001F634
    ${s.sleep_consistency_days_logged} good sleeps ` +\n        `<span style=\"color:#bbb\">(this
    week)</span>`;\n\n      document.getElementById(\"wellness-goals\").innerHTML
    = goals.length\n        ? \"<h3 style='color:#764ba2;margin-bottom:8px;'>\U0001F3AF
    My Goals</h3>\" +\n          goals.map(g => `<div class=\"period\">${g.kind.replaceAll(\"_\",
    \" \")}: ${g.target_value} ${g.target_unit}</div>`).join(\"\")\n        : \"\";\n\n
    \     document.getElementById(\"wellness-challenges\").innerHTML = challenges.length\n
    \       ? \"<h3 style='color:#764ba2;margin-bottom:8px;'>\U0001F3C6 Family Challenges</h3>\"
    +\n          challenges.map(c => {\n            const mine = c.progress[myUserId];\n
    \           const pct = mine ? Math.min(100, (mine.value / c.target_value) * 100)
    : 0;\n            return `<div style=\"margin-bottom:10px;\"><b>${c.title}</b>\n
    \             <div class=\"h-bar\" style=\"background:#f0ecff;border-radius:8px;height:14px;overflow:hidden;margin-top:4px;\">\n
    \               <div style=\"background:linear-gradient(135deg,#667eea,#764ba2);height:14px;width:${pct}%\"></div>\n
    \             </div></div>`;\n          }).join(\"\")\n        : \"\";\n    }\n
    \ </script>\n</body>\n</html>\n"
