    }, credentials: \"same-origin\",\n        });\n        const data = await r.json();\n
    \       if (!r.ok || !data.could_read_page) {\n          result.innerHTML = \"\U0001F615
    I couldn't read that clearly — try a closer, brighter photo!\";\n          return;\n
    \       }\n        result.innerHTML =\n          (data.question_text ? `<div class=\"q\">\U0001F4D6
