    style=\"color:#bbb\">No classes set</div>'\n        }</div>`;\n      }).join(\"\");\n
    \   }\n\n    function storyCard(story) {\n      return `<div class=\"hw-item\"
    style=\"flex-direction:column; align-items:stretch; gap:8px;\">\n        <b>${story.title}</b>\n
    \       ${story.image_url ? `<img src=\"${story.image_url}\" style=\"max-width:100%;
    border-radius:12px;\">` : \"\"}\n        <div>${story.chapter_text}</div>\n      </div>`;\n
    \   }\n\n    async function loadStories() {\n      const rows = await api(\"/tutor/stories\");\n
    \     document.getElementById(\"story-list\").innerHTML = rows.length\n        ?
    rows.map(storyCard).join(\"\")\n        : '<div class=\"status-msg\">No stories
