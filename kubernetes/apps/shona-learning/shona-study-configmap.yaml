    = \"\";\n      document.getElementById(\"read-minutes\").value = \"\";\n      loadReadingStreak();\n
    \   }\n\n    async function loadTimetable() {\n      const rows = await api(\"/tutor/timetable\");\n
    \     const byDay = Object.fromEntries(rows.map(r => [r.day_of_week, r.periods]));\n
    \     document.getElementById(\"timetable-list\").innerHTML = DAY_NAMES.map((name,
